    .flip-perspective {
      perspective: 1200px;
    }

    .flip-inner {
      display: grid;
      grid-template-columns: 1fr;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);

      -webkit-transform: rotateY(180deg);
    }

      grid-area: 1 / 1 / 2 / 2;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .flip-back {
      transform: rotateY(180deg) translateZ(1px);
      -webkit-transform: rotateY(180deg) translateZ(1px);
    }

    const normalizeSearchText = (str) => {
      if (!str) return "";
      return str
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    };

    // y aplique la aproximación fonética "red" al pasado/participio de "read" sin depender de su número de orden.
    const formatSpokenEnglishForm = (verb, formType) => {
      const rawValue = verb[formType] || "";

      // Caso especial: verbo READ (identificado por su forma verbal/UID, independientemente de su número 66)
      // Present -> "read" (/riːd/), Past Simple y Past Participle -> "red" (/red/)
      if (verb.present === "read" && (formType === "past" || formType === "participle")) {
        return "red";
      }

      // Sustituir barras "/" por una coma y espacio para que pronuncie ambas variantes con pausa natural
      return rawValue.replace(/\s*\/\s*/g, ", ");
    };

    /**
     * ============================================================================
     * 6. PANTALLA DE ACCESO CORPORATIVA (AULA NEXT ESO)
     * No renderiza ninguna tarjeta ni dato de verbos antes de validar el acceso.

    const LockScreen = ({ onUnlock, isDark, onToggleTheme }) => {
      const [passwordInput, setPasswordInput] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (passwordInput === ACCESS_KEY_REQUIRED) {
          try {
            localStorage.setItem(STORAGE_KEYS.UNLOCKED, "1");
          } catch (err) {
            // Continuar en memoria si el navegador bloquea localStorage
          }
          onUnlock();
        } else {
          setErrorMsg("Contraseña incorrecta. Verifica las mayúsculas, minúsculas y símbolos.");
        }
      };

      return (
        <div className="min-h-screen w-full flex flex-col justify-between bg-gradient-to-b from-[#EAF2FB] via-[#F5F9FD] to-white dark:from-[#071124] dark:via-[#09152B] dark:to-[#0C1B36] p-4 sm:p-6 transition-colors duration-200">

                  <SunIcon className="w-4 h-4 text-[#F08519]" />
                  <span>Modo Claro</span>
                </>

                <>

                  <span>Modo Nocturno</span>

                    105 VERBOS · LISTA OFICIAL DE INGLÉS

                  <p className="mt-1.5 text-sm text-slate-600 dark:text-slate-300 font-medium">

                <form onSubmit={handleSubmit} className="space-y-4">

                    <label

    /**
     * ============================================================================
     * 7. COMPONENTE FLASHCARD INTERACTIVA (ANVERSO Y REVERSO)
     * Altura dinámica sin recortes, audio general e individual, marcado de difícil.
     * ============================================================================
     */
    const VerbFlashcard = ({
      verb,
      isDifficult,
      onToggleDifficult,
      onSpeakAll,
      onSpeakSingle,
      isFocusMode = false,
      externalFlipTrigger = 0
    }) => {
      const [flipped, setFlipped] = useState(false);

      // Al cambiar de verbo, volver siempre al anverso
      useEffect(() => {
        setFlipped(false);
      }, [verb.uid]);

      // Permitir giro por teclado desde el Modo Focus
      useEffect(() => {
        if (externalFlipTrigger > 0) {
          setFlipped(prev => !prev);
        }
      }, [externalFlipTrigger]);

      const handleCardClick = () => {
        setFlipped(prev => !prev);
      };

      const handleAudioAllClick = (e) => {
        e.stopPropagation();
        onSpeakAll(verb);
      };

      const handleAudioSingleClick = (e, formKey) => {
        e.stopPropagation();
        onSpeakSingle(verb, formKey);
      };

      const handleDifficultClick = (e) => {
        e.stopPropagation();
        onToggleDifficult(verb.uid);
      };

      return (
        <div
          onClick={handleCardClick}
          role="button"
          tabIndex={0}
          onKeyDown={(e) => {
            if (!isFocusMode && (e.key === "Enter" || e.key === " ")) {
              e.preventDefault();
              setFlipped(prev => !prev);
            }
          }}
          aria-label={`Verbo ${verb.id}: ${verb.present}. Toca para girar.`}
          className={`w-full flip-perspective cursor-pointer select-none group ${

              } ${
                isFocusMode ? "an-card-shadow-focus p-6 sm:p-8 min-h-[340px]" : "an-card-shadow p-5 min-h-[290px]"
              } flex flex-col justify-between transition-all`}
            >
              {/* Acento superior corporativo sutil */}
              <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#0F2547] via-[#0055A5] to-[#F08519]"></div>

              {/* Cabecera del Anverso: Número + Bloque + Acciones */}
              <div className="flex items-center justify-between gap-2 pt-1">

                  <span className="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-white/80 dark:bg-[#0B1830]/80 text-[#0F2547]/80 dark:text-slate-200 border border-[#0055A5]/15 dark:border-slate-600/70">

                    type="button"
                    onClick={handleDifficultClick}
                    title={isDifficult ? "Quitar de verbos difíciles" : "Marcar como verbo difícil"}
                    aria-label={isDifficult ? "Quitar de verbos difíciles" : "Marcar como verbo difícil"}
                    className={`p-2.5 rounded-xl border transition active:scale-95 ${
                      isDifficult
                        ? "bg-amber-50 dark:bg-[#F08519]/20 border-[#F08519] text-[#F08519]"
                        : "bg-white/85 dark:bg-[#0B1830]/80 border-slate-200/90 dark:border-slate-600/80 text-slate-400 dark:text-slate-300 hover:text-[#F08519] hover:border-[#F08519]/50"
                    }`}
                  >
                    <StarIcon className="w-5 h-5" filled={isDifficult} />
                  </button>

                  <button
                    type="button"
                    onClick={handleAudioAllClick}
                    title="Escuchar las tres formas en inglés"
                    aria-label={`Escuchar pronunciación de ${verb.present}`}

                  >
                    <SpeakerIcon className="w-5 h-5" />
                  </button>
                </div>
              </div>

              {/* Cuerpo Central del Anverso: PRESENT destacado */}

                    Present

                </div>
                <div
                  className={`font-black text-[#0F2547] dark:text-white tracking-tight break-words leading-tight ${
                    isFocusMode ? "text-4xl sm:text-5xl" : "text-3xl sm:text-4xl"
                  }`}
                >
                  {verb.present}
                </div>
                {verb.note && (
                  <div className="mt-2.5">
                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-md text-[11px] font-extrabold uppercase tracking-wider bg-[#F08519]/15 dark:bg-[#F08519]/25 text-[#C86400] dark:text-amber-300 border border-[#F08519]/30">

                <span className="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-white/75 dark:bg-[#0B1830]/75 border border-[#0055A5]/15 dark:border-slate-600/60 text-xs font-bold text-[#0F2547]/80 dark:text-slate-200 group-hover:border-[#0055A5]/40 dark:group-hover:border-sky-400/50 transition">

                </span>
              </div>
            </div>

            {/* ============================================================
                REVERSO DE LA TARJETA (3 FORMAS + CASTELLANO + VALENCIÀ)
                Jerarquía cromática: Present (Azul marino), Past Simple (Azul corporativo),
                Past Participle (Naranja), Meanings (Verde corporativo suave)
               ============================================================ */}
            <div
              className={`flip-face flip-back w-full rounded-2xl an-back-surface border-2 ${
                isDifficult ? "border-[#F08519]" : "border-[#0055A5] dark:border-sky-500/80"
              } ${

            >
              {/* Cabecera del Reverso */}
              <div className="flex items-center justify-between gap-2 pb-2 border-b border-slate-200/80 dark:border-slate-700/80">
                <div className="flex items-center gap-2">
                  <span className="inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-xs font-black bg-[#F08519] text-white">

                  <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-300">

                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={handleDifficultClick}
                    title={isDifficult ? "Quitar de difíciles" : "Marcar como difícil"}

                    className={`p-2 rounded-xl border transition active:scale-95 ${
                      isDifficult
                        ? "bg-amber-50 dark:bg-[#F08519]/20 border-[#F08519] text-[#F08519]"

                    }`}
                  >
                    <StarIcon className="w-4 h-4" filled={isDifficult} />
                  </button>

                  <button
                    type="button"
                    onClick={handleAudioAllClick}
                    title="Escuchar las 3 formas seguidas"
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#0055A5] hover:bg-[#0F2547] dark:hover:bg-sky-500 text-white text-xs font-bold transition active:scale-95 shadow-sm"
                  >
                    <SpeakerIcon className="w-4 h-4" />
                    <span>3 Formas</span>
                  </button>
                </div>
              </div>

              {/* Las 3 formas inglesas con su jerarquía cromática corporativa */}
              <div className="grid grid-cols-1 gap-2">
                {/* 1. PRESENT -> Azul Marino (#0F2547) */}
                <div className="flex items-center justify-between gap-2 bg-[#0F2547]/[0.05] dark:bg-[#162E57]/90 rounded-xl px-3.5 py-2 border border-[#0F2547]/15 dark:border-slate-600/80 border-l-4 border-l-[#0F2547] dark:border-l-slate-200 transition">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#0F2547]/75 dark:text-slate-300">
                        Present
                      </span>
                      {verb.note && (
                        <span className="px-1.5 py-0.2 rounded text-[9px] font-extrabold uppercase tracking-wider bg-[#F08519]/15 dark:bg-[#F08519]/25 text-[#C86400] dark:text-amber-300">
                          {verb.note}
                        </span>
                      )}
                    </div>
                    <span className={`block font-black text-[#0F2547] dark:text-white break-words leading-snug ${isFocusMode ? "text-lg sm:text-xl" : "text-base"}`}>
                      {verb.present}
                    </span>
                  </div>
                  <button
                    type="button"
                    onClick={(e) => handleAudioSingleClick(e, "present")}
                    title={`Escuchar Present: ${verb.present}`}
                    aria-label={`Escuchar Present: ${verb.present}`}
                    className="p-2 rounded-lg text-[#0F2547] dark:text-slate-100 hover:bg-[#0F2547]/10 dark:hover:bg-white/10 active:scale-95 transition shrink-0"
                  >
                    <SpeakerIcon className="w-4 h-4" />
                  </button>
                </div>

                      Past Simple

                  >
                    <SpeakerIcon className="w-4 h-4" />
                  </button>

                {/* 3. PAST PARTICIPLE -> Naranja Corporativo (#F08519) */}
                <div className="flex items-center justify-between gap-2 bg-[#F08519]/[0.09] dark:bg-[#F08519]/20 rounded-xl px-3.5 py-2 border border-[#F08519]/30 dark:border-[#F08519]/40 border-l-4 border-l-[#F08519] transition">
                  <div className="min-w-0 flex-1">
                    <span className="block text-[10px] font-extrabold uppercase tracking-wider text-[#C86400] dark:text-amber-300">
                      Past Participle
                    </span>
                    <span className={`block font-black text-[#B85900] dark:text-amber-100 break-words leading-snug ${isFocusMode ? "text-lg sm:text-xl" : "text-base"}`}>
                      {verb.participle}
                      {verb.present === "read" && (
                        <span className="ml-1.5 text-[11px] font-semibold text-[#9A4B00] dark:text-amber-200/80">/red/</span>
                      )}

                    aria-label={`Escuchar Past Participle: ${verb.participle}`}
                    className="p-2 rounded-lg text-[#C86400] dark:text-amber-200 hover:bg-[#F08519]/15 dark:hover:bg-[#F08519]/25 active:scale-95 transition shrink-0"
                  >
                    <SpeakerIcon className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Bloque de Significados (Castellano y Valencià) con color Verde Corporativo suave (#28A86B) */}
              <div className="rounded-xl bg-[#28A86B]/[0.11] dark:bg-[#28A86B]/20 border border-[#28A86B]/30 dark:border-[#28A86B]/45 border-l-4 border-l-[#28A86B] p-3 space-y-2">
                <div className="flex flex-col">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#1B7A4E] dark:text-emerald-300">
                    Meaning · Castellano
                  </span>

                  </span>

                <div className="h-px bg-[#28A86B]/25 dark:bg-emerald-400/25 w-full"></div>

                  </span>
                  <span className={`font-extrabold text-[#0F2547] dark:text-emerald-50 break-words leading-snug ${isFocusMode ? "text-base" : "text-sm"}`}>

              {/* Pie del Reverso */}

    };

    /**
     * ============================================================================
     * 8. APLICACIÓN PRINCIPAL (AULA NEXT ESO)
     * ============================================================================
     */
    const App = () => {
      // Estado de Modo Nocturno / Claro (respeta localStorage o preferencia del sistema en 1ª visita)
      const [isDark, setIsDark] = useState(() => {
        try {
          const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
          if (savedTheme === "dark") return true;
          if (savedTheme === "light") return false;
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            return true;
          }
        } catch {
          // Ignorar si localStorage está restringido
        }
        return false;
      });

      // Aplicar clase 'dark' al elemento raíz <html> de forma inmediata
      useEffect(() => {
        const rootHtml = document.documentElement;
        if (isDark) {
          rootHtml.classList.add("dark");
        } else {
          rootHtml.classList.remove("dark");
        }
        try {
          localStorage.setItem(STORAGE_KEYS.THEME, isDark ? "dark" : "light");
        } catch {
          // Ignorar errores de almacenamiento
        }
      }, [isDark]);

      const handleToggleTheme = useCallback(() => {
        setIsDark(prev => !prev);
      }, []);

      // Estado de sesión
      const [isUnlocked, setIsUnlocked] = useState(() => {
        try {
          return localStorage.getItem(STORAGE_KEYS.UNLOCKED) === "1";
        } catch {
          return false;
        }
      });

      // Modos de estudio: 'grid' | 'focus'
      const [studyMode, setStudyMode] = useState("grid");

      // Filtro por bloque: 'all' | 1 | 2 | 3 | 4 | 5
      const [selectedBlock, setSelectedBlock] = useState("all");

      // Buscador
      const [searchQuery, setSearchQuery] = useState("");

      // Orden de los UIDs (permite barajar y restaurar el orden 1-105 manteniendo la identidad de cada entrada)
      const [verbOrderUids, setVerbOrderUids] = useState(() => VERBS_DATA.map(v => v.uid));
      const [isShuffled, setIsShuffled] = useState(false);

      // Verbos marcados como difíciles (guardados por UID estable en localStorage, con migración segura desde la versión de 95 verbos)
      const [difficultUids, setDifficultUids] = useState(() => {
        const validUids = new Set(VERBS_DATA.map(v => v.uid));
        try {
          // 1. Intentar leer la clave nueva de 105 verbos (basada en UID estable)
          const savedV2 = localStorage.getItem(STORAGE_KEYS.DIFFICULT_V2);
          if (savedV2) {
            const parsedV2 = JSON.parse(savedV2);
            if (Array.isArray(parsedV2)) {
              return new Set(parsedV2.filter(uid => typeof uid === "string" && validUids.has(uid)));
            }
          }

          // 2. Migración automática y segura desde la versión anterior (95 verbos por ID numérico)
          const legacyRaw = localStorage.getItem(STORAGE_KEYS.LEGACY_DIFFICULT_V1);
          if (legacyRaw) {
            const parsedLegacy = JSON.parse(legacyRaw);
            if (Array.isArray(parsedLegacy)) {
              const migrated = new Set();
              parsedLegacy.forEach(oldItem => {
                if (typeof oldItem === "number" && LEGACY_95_ID_TO_UID[oldItem]) {
                  const mappedUid = LEGACY_95_ID_TO_UID[oldItem];
                  if (validUids.has(mappedUid)) migrated.add(mappedUid);
                } else if (typeof oldItem === "string" && validUids.has(oldItem)) {
                  migrated.add(oldItem);
                }
              });
              localStorage.setItem(STORAGE_KEYS.DIFFICULT_V2, JSON.stringify([...migrated]));
              return migrated;
            }
          }
        } catch {
          return new Set();
        }
        return new Set();
      });
      const [onlyDifficult, setOnlyDifficult] = useState(false);

      // Índice actual en Modo Focus y disparador de giro por teclado
      const [focusIndex, setFocusIndex] = useState(0);
      const [keyboardFlipCount, setKeyboardFlipCount] = useState(0);

      // Estado del motor de voz (Web Speech API)
      const [voices, setVoices] = useState([]);
      const [audioNotice, setAudioNotice] = useState(null);

      // Cargar voces disponibles en el navegador
      useEffect(() => {
        if (!("speechSynthesis" in window)) {
          setAudioNotice("Tu navegador no soporta síntesis de voz integrada.");
          return;
        }

        const updateVoices = () => {
          const available = window.speechSynthesis.getVoices() || [];
          setVoices(available);
        };

        updateVoices();
        window.speechSynthesis.onvoiceschanged = updateVoices;

        return () => {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = null;
          }
        };
      }, []);

      // Sincronizar verbos difíciles por UID estable en localStorage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.DIFFICULT_V2, JSON.stringify([...difficultUids]));
        } catch {
          // Ignorar errores de cuota o navegación privada
        }
      }, [difficultUids]);

      // Selección preferente de voz británica (en-GB) o respaldo en inglés (en-*)
      const preferredEnglishVoice = useMemo(() => {
        if (!voices || voices.length === 0) return null;
        const gbVoices = voices.filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("en-gb"));
        if (gbVoices.length > 0) {
          const premiumGb = gbVoices.find(v => /google|daniel|libby|hazel|kate|serena|natural/i.test(v.name));
          return premiumGb || gbVoices[0];
        }
        const anyEnglish = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
        return anyEnglish || null;
      }, [voices]);

      // Función para pronunciar texto en inglés
      const speakEnglishText = useCallback((textToSpeak) => {
        if (!("speechSynthesis" in window)) {
          setAudioNotice("Este navegador no permite reproducir audio por síntesis de voz.");
          return;
        }

        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(textToSpeak);
          utterance.lang = "en-GB";
          utterance.rate = 0.85; // Velocidad didáctica para 1.º ESO
          utterance.pitch = 1.0;

          if (preferredEnglishVoice) {
            utterance.voice = preferredEnglishVoice;
            utterance.lang = preferredEnglishVoice.lang;
          } else if (voices.length > 0) {
            // Si el dispositivo cargó voces pero ninguna es inglesa, avisar al usuario
            const hasAnyEn = voices.some(v => v.lang && v.lang.toLowerCase().startsWith("en"));
            if (!hasAnyEn) {
              setAudioNotice("No se ha detectado una voz en inglés instalada en tu dispositivo. Es posible que la pronunciación no sea precisa.");
            }
          }

          window.speechSynthesis.speak(utterance);
        } catch (err) {
          setAudioNotice("No se pudo iniciar la reproducción de voz en este navegador.");
        }
      }, [preferredEnglishVoice, voices]);

      // Pronunciar las 3 formas de un verbo
      const handleSpeakAllForms = useCallback((verb) => {
        const p1 = formatSpokenEnglishForm(verb, "present");
        const p2 = formatSpokenEnglishForm(verb, "past");
        const p3 = formatSpokenEnglishForm(verb, "participle");
        speakEnglishText(`${p1}. ${p2}. ${p3}.`);
      }, [speakEnglishText]);

      // Pronunciar 1 sola forma de un verbo
      const handleSpeakSingleForm = useCallback((verb, formKey) => {
        const spokenForm = formatSpokenEnglishForm(verb, formKey);
        speakEnglishText(spokenForm);
      }, [speakEnglishText]);

      // Mapa rápido por UID estable
      const verbsByUid = useMemo(() => {
        const map = new Map();
        VERBS_DATA.forEach(v => map.set(v.uid, v));
        return map;
      }, []);

      // Lista filtrada y ordenada según Bloque, Búsqueda, Difíciles y Orden actual
      const filteredVerbs = useMemo(() => {
        const q = normalizeSearchText(searchQuery);
        const orderedList = verbOrderUids.map(uid => verbsByUid.get(uid)).filter(Boolean);

        return orderedList.filter(verb => {
          // 1. Filtro por bloque (1..5 o 'all')
          if (selectedBlock !== "all" && verb.block !== selectedBlock) {
            return false;
          }

          // 2. Filtro de solo difíciles (identificado por UID estable)
          if (onlyDifficult && !difficultUids.has(verb.uid)) {
            return false;
          }

          // 3. Filtro por buscador (número, formas inglesas, castellano, valenciano o nota)
          if (q.length > 0) {
            const idMatch = verb.id.toString() === q || `#${verb.id}` === q;
            const presentMatch = normalizeSearchText(verb.present).includes(q);
            const pastMatch = normalizeSearchText(verb.past).includes(q);
            const participleMatch = normalizeSearchText(verb.participle).includes(q);
            const esMatch = normalizeSearchText(verb.es).includes(q);
            const vaMatch = normalizeSearchText(verb.va).includes(q);
            const noteMatch = verb.note ? normalizeSearchText(verb.note).includes(q) : false;

            return idMatch || presentMatch || pastMatch || participleMatch || esMatch || vaMatch || noteMatch;
          }

          return true;
        });
      }, [verbOrderUids, verbsByUid, selectedBlock, onlyDifficult, difficultUids, searchQuery]);

      // Ajustar el índice del Modo Focus cuando cambian los filtros
      useEffect(() => {
        setFocusIndex(0);
      }, [selectedBlock, onlyDifficult, searchQuery]);

      useEffect(() => {
        if (focusIndex >= filteredVerbs.length && filteredVerbs.length > 0) {
          setFocusIndex(filteredVerbs.length - 1);
        }
      }, [filteredVerbs.length, focusIndex]);

      // Navegación Anterior / Siguiente en Modo Focus
      const handlePrevFocus = useCallback(() => {
        if (filteredVerbs.length === 0) return;
        setFocusIndex(prev => (prev - 1 + filteredVerbs.length) % filteredVerbs.length);
      }, [filteredVerbs.length]);

      const handleNextFocus = useCallback(() => {
        if (filteredVerbs.length === 0) return;
        setFocusIndex(prev => (prev + 1) % filteredVerbs.length);
      }, [filteredVerbs.length]);

      // Soporte de teclado en Modo Focus (Flechas y Espacio)
      useEffect(() => {
        if (!isUnlocked || studyMode !== "focus") return;

        const handleKeyDown = (e) => {
          // No interceptar teclas si el alumno está escribiendo en el buscador
          if (document.activeElement && document.activeElement.tagName === "INPUT") {
            return;
          }

          if (e.key === "ArrowRight") {
            e.preventDefault();
            handleNextFocus();
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            handlePrevFocus();
          } else if (e.code === "Space") {
            e.preventDefault();
            setKeyboardFlipCount(c => c + 1);
          }
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [isUnlocked, studyMode, handleNextFocus, handlePrevFocus]);

      // Barajar verbos (Fisher-Yates sobre UIDs)
      const handleShuffle = () => {
        const copy = [...verbOrderUids];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        setVerbOrderUids(copy);
        setIsShuffled(true);
        setFocusIndex(0);
      };

      // Restaurar orden original 1–105
      const handleRestoreOrder = () => {
        setVerbOrderUids(VERBS_DATA.map(v => v.uid));
        setIsShuffled(false);
        setFocusIndex(0);
      };

      // Marcar / desmarcar verbo difícil por UID estable
      const handleToggleDifficult = useCallback((verbUid) => {
        setDifficultUids(prev => {
          const next = new Set(prev);
          if (next.has(verbUid)) {
            next.delete(verbUid);
          } else {
            next.add(verbUid);
          }
          return next;
        });
      }, []);

      // Cerrar sesión
      const handleLogout = () => {
        try {
          localStorage.removeItem(STORAGE_KEYS.UNLOCKED);
        } catch {
          // Ignorar error
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        setIsUnlocked(false);
      };

      // Si no está desbloqueado, renderizar exclusivamente la pantalla de acceso
      if (!isUnlocked) {
        return (
          <LockScreen
            onUnlock={() => setIsUnlocked(true)}
            isDark={isDark}
            onToggleTheme={handleToggleTheme}
          />
        );
      }

      const currentFocusVerb = filteredVerbs[focusIndex] || null;
      const progressPercentage =
        filteredVerbs.length > 0 ? Math.round(((focusIndex + 1) / filteredVerbs.length) * 100) : 0;

      const BLOCKS_META = [
        { id: "all", label: "Todos", range: "1–105" },
        { id: 1,     label: "Bloque 1", range: "1–21" },
        { id: 2,     label: "Bloque 2", range: "22–42" },
        { id: 3,     label: "Bloque 3", range: "43–63" },
        { id: 4,     label: "Bloque 4", range: "64–84" },
        { id: 5,     label: "Bloque 5", range: "85–105" },
      ];

      return (
        <div className="min-h-screen flex flex-col bg-[#F8FAFC] dark:bg-[#09152B] text-[#0F2547] dark:text-slate-100 transition-colors duration-200">
          {/* Banda superior corporativa */}
          <div className="h-1.5 w-full bg-gradient-to-r from-[#0F2547] via-[#0055A5] to-[#28A86B]"></div>

          {/* ====================================================================
              CABECERA CORPORATIVA AULA NEXT ESO
             ==================================================================== */}
          <header className="bg-white/95 dark:bg-[#0E1E3B]/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 sticky top-0 z-30 shadow-sm transition-colors duration-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3 sm:gap-4">
              <div className="flex items-center gap-3 sm:gap-5">
                <BrandLogo size="md" />
                <div className="hidden sm:block h-8 w-px bg-slate-200 dark:bg-slate-700"></div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-[#F08519]/15 dark:bg-[#F08519]/25 text-[#D9720E] dark:text-amber-300">
                      1.º ESO · Inglés
                    </span>
                    {VALIDATION_REPORT.valid ? (
                      <span className="hidden md:inline-flex items-center gap-1 text-[11px] font-bold text-[#1E8252] dark:text-emerald-300 bg-[#28A86B]/10 dark:bg-[#28A86B]/25 px-2.5 py-0.5 rounded-full">
                        ✓ 105 verbos verificados
                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold text-red-700 dark:text-red-300 bg-red-100 dark:bg-red-950/60 px-2.5 py-0.5 rounded-full">
                        ⚠ Error de validación ({VALIDATION_REPORT.errors.length})
                      </span>
                    )}
                  </div>
                  <h1 className="text-sm sm:text-lg md:text-xl font-extrabold text-[#0F2547] dark:text-white tracking-tight mt-0.5">
                    105 VERBOS · LISTA OFICIAL DE INGLÉS
                  </h1>
                </div>
              </div>

              {/* Controles de Cabecera: Lema + Botón Modo Nocturno (Sol/Luna) + Salir */}
              <div className="flex items-center gap-2 sm:gap-2.5">
                <div className="hidden lg:flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-[#13284C] px-3 py-1.5 rounded-xl border border-slate-200/70 dark:border-slate-700/80">
                  <span className="w-2 h-2 rounded-full bg-[#28A86B]"></span>
                  <span>Un bloque cada vez · Di en voz alta las 3 formas</span>
                </div>

                {/* Botón de Modo Claro / Modo Nocturno */}
                <button
                  type="button"
                  onClick={handleToggleTheme}
                  aria-label={isDark ? "Activar modo claro" : "Activar modo nocturno"}
                  title={isDark ? "Cambiar a modo claro" : "Cambiar a modo nocturno"}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-extrabold border bg-slate-100 hover:bg-slate-200/80 text-[#0F2547] border-slate-200/90 dark:bg-[#152C52] dark:hover:bg-[#1C3866] dark:text-slate-100 dark:border-slate-700 transition active:scale-95"
                >
                  {isDark ? (
                    <>
                      <SunIcon className="w-4 h-4 text-[#F08519]" />
                      <span className="hidden sm:inline">Claro</span>
                    </>
                  ) : (
                    <>
                      <MoonIcon className="w-4 h-4 text-[#0055A5]" />
                      <span className="hidden sm:inline">Nocturno</span>
                    </>
                  )}
                </button>

                <button
                  type="button"
                  onClick={handleLogout}
                  className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-red-600 dark:hover:text-red-300 bg-slate-100 dark:bg-[#152C52] hover:bg-red-50 dark:hover:bg-red-950/50 border border-slate-200/80 dark:border-slate-700 transition active:scale-95"
                  title="Cerrar sesión"
                >
                  <LogoutIcon className="w-4 h-4" />
                  <span className="hidden sm:inline">Salir</span>
                </button>
              </div>
            </div>
          </header>

          {/* ====================================================================
              PANEL DE HERRAMIENTAS, BLOQUES Y CONTROLES DE ESTUDIO
             ==================================================================== */}
          <section className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-5 pb-2 space-y-4">
            
            {/* Aviso en caso de limitación de voz del dispositivo */}
            {audioNotice && (
              <div className="bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-700/80 rounded-2xl p-3.5 flex items-center justify-between gap-3 text-xs sm:text-sm font-semibold text-amber-900 dark:text-amber-100">
                <div className="flex items-center gap-2">
                  <span>🔊</span>
                  <span>{audioNotice}</span>
                </div>
                <button
                  onClick={() => setAudioNotice(null)}
                  className="px-2.5 py-1 rounded-lg bg-amber-200/60 dark:bg-amber-800/70 hover:bg-amber-200 dark:hover:bg-amber-700 font-bold text-xs shrink-0"
                >
                  Entendido
                </button>
              </div>
            )}

            {/* 1. Selector de los 5 Bloques del PDF */}
            <div className="bg-white dark:bg-[#112445] rounded-2xl p-2 sm:p-2.5 border border-slate-200/90 dark:border-slate-700/80 an-card-shadow transition-colors duration-200">
              <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                {BLOCKS_META.map(b => {
                  const active = selectedBlock === b.id;
                  return (
                    <button
                      key={b.id}
                      type="button"
                      onClick={() => setSelectedBlock(b.id)}
                      className={`flex-1 min-w-[105px] sm:min-w-[120px] px-3 py-2 rounded-xl text-center transition select-none ${
                        active
                          ? "bg-[#0F2547] dark:bg-[#0055A5] text-white shadow-sm ring-1 ring-[#0055A5]/40"
                          : "bg-slate-50/90 dark:bg-[#0B1830]/90 hover:bg-slate-100 dark:hover:bg-[#162E57] text-slate-600 dark:text-slate-300"
                      }`}
                    >
                      <div className="text-xs sm:text-sm font-extrabold leading-tight">
                        {b.label}
                      </div>
                      <div className={`text-[10px] font-bold mt-0.5 ${active ? "text-[#F08519] dark:text-amber-300" : "text-slate-400 dark:text-slate-400"}`}>
                        Verbos {b.range}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 2. Barra de Modos (Grid / Focus), Buscador, Ordenación y Filtro de Difíciles */}
            <div className="bg-white dark:bg-[#112445] rounded-2xl p-3.5 sm:p-4 border border-slate-200/90 dark:border-slate-700/80 an-card-shadow flex flex-col gap-3.5 transition-colors duration-200">
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                
                {/* Izquierda: Selector Modo Grid / Focus + Buscador */}
                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 flex-1">
                  {/* Conmutador Grid / Focus */}
                  <div className="inline-flex bg-slate-100 dark:bg-[#0B1830] p-1 rounded-xl border border-slate-200/80 dark:border-slate-700/80 self-start sm:self-auto shrink-0">
                    <button
                      type="button"
                      onClick={() => setStudyMode("grid")}
                      className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition ${
                        studyMode === "grid"
                          ? "bg-[#0055A5] text-white shadow-sm"
                          : "text-slate-600 dark:text-slate-300 hover:text-[#0F2547] dark:hover:text-white"
                      }`}
                    >
                      <GridIcon className="w-4 h-4" />
                      <span>Modo Grid</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setStudyMode("focus")}
                      className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-extrabold flex items-center gap-1.5 transition ${
                        studyMode === "focus"
                          ? "bg-[#0055A5] text-white shadow-sm"
                          : "text-slate-600 dark:text-slate-300 hover:text-[#0F2547] dark:hover:text-white"
                      }`}
                    >
                      <FocusIcon className="w-4 h-4" />
                      <span>Modo Focus</span>
                    </button>
                  </div>

                  {/* Buscador multi-campo */}
                  <div className="relative flex-1 max-w-md">
                    <SearchIcon className="w-4 h-4 text-slate-400 dark:text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar por n.º, inglés, castellano o valencià..."
                      aria-label="Buscar verbos"
                      className="w-full pl-9 pr-16 py-2 rounded-xl border border-slate-200 dark:border-slate-600/90 bg-slate-50/80 dark:bg-[#0B1830] focus:bg-white dark:focus:bg-[#0E1E3B] text-sm font-medium text-[#0F2547] dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0055A5] focus:border-[#0055A5] transition"
                    />
                    {searchQuery ? (
                      <button
                        type="button"
                        onClick={() => setSearchQuery("")}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] font-extrabold text-slate-500 dark:text-slate-200 hover:text-[#0F2547] dark:hover:text-white bg-slate-200/80 dark:bg-slate-700 px-2 py-0.5 rounded-md"
                      >
                        Limpiar
                      </button>
                    ) : (
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-extrabold text-slate-400 dark:text-slate-400 pointer-events-none">
                        {filteredVerbs.length}
                      </span>
                    )}
                  </div>
                </div>

                {/* Derecha: Barajar, Restaurar 1-95 y Filtro de Difíciles */}
                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    onClick={handleShuffle}
                    className="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-600/90 bg-white dark:bg-[#0B1830] hover:bg-slate-50 dark:hover:bg-[#162E57] text-[#0F2547] dark:text-slate-100 text-xs sm:text-sm font-bold inline-flex items-center gap-1.5 transition active:scale-95"
                    title="Barajar los verbos aleatoriamente"
                  >
                    <ShuffleIcon className="w-4 h-4 text-[#0055A5] dark:text-sky-400" />
                    <span>Barajar</span>
                  </button>

                  {isShuffled && (
                    <button
                      type="button"
                      onClick={handleRestoreOrder}
                      className="px-3.5 py-2 rounded-xl border border-[#0055A5]/30 dark:border-sky-400/40 bg-[#0055A5]/5 dark:bg-[#0055A5]/25 hover:bg-[#0055A5]/10 dark:hover:bg-[#0055A5]/35 text-[#0055A5] dark:text-sky-200 text-xs sm:text-sm font-bold inline-flex items-center gap-1.5 transition active:scale-95"
                      title="Restaurar orden numérico del 1 al 105"
                    >
                      <OrderResetIcon className="w-4 h-4" />
                      <span>Orden 1–105</span>
                    </button>
                  )}

                  <button
                    type="button"
                    onClick={() => setOnlyDifficult(prev => !prev)}
                    className={`px-3.5 py-2 rounded-xl border text-xs sm:text-sm font-extrabold inline-flex items-center gap-1.5 transition active:scale-95 ${
                      onlyDifficult
                        ? "bg-[#F08519] border-[#F08519] text-white shadow-sm"
                        : "bg-white dark:bg-[#0B1830] border-slate-200 dark:border-slate-600/90 text-[#0F2547] dark:text-slate-100 hover:bg-amber-50/50 dark:hover:bg-[#162E57]"
                    }`}
                  >
                    <StarIcon className="w-4 h-4" filled={onlyDifficult || difficultUids.size > 0} />
                    <span>Difíciles</span>
                    <span
                      className={`ml-0.5 px-1.5 py-0.2 rounded-full text-[11px] ${
                        onlyDifficult
                          ? "bg-white/25 text-white"
                          : "bg-amber-100 dark:bg-[#F08519]/25 text-[#D9720E] dark:text-amber-300"
                      }`}
                    >
                      {difficultUids.size}
                    </span>
                  </button>
                </div>
              </div>

              {/* Barra inferior de estado y progreso (siempre visible y sincronizada con los filtros) */}
              <div className="pt-2 border-t border-slate-100 dark:border-slate-700/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs font-semibold text-slate-500 dark:text-slate-300">
                <div className="flex flex-wrap items-center gap-2">
                  <span>
                    Mostrando <strong className="text-[#0F2547] dark:text-white">{filteredVerbs.length}</strong> de 105 verbos
                  </span>
                  {selectedBlock !== "all" && (
                    <span className="px-2 py-0.5 rounded-md bg-[#0F2547]/5 dark:bg-sky-400/15 text-[#0F2547] dark:text-sky-200 font-bold">
                      Bloque {selectedBlock}
                    </span>
                  )}
                  {onlyDifficult && (
                    <span className="px-2 py-0.5 rounded-md bg-amber-100 dark:bg-[#F08519]/25 text-[#D9720E] dark:text-amber-300 font-bold">
                      Filtro: Solo difíciles
                    </span>
                  )}
                  {isShuffled && (
                    <span className="px-2 py-0.5 rounded-md bg-blue-50 dark:bg-[#0055A5]/30 text-[#0055A5] dark:text-sky-200 font-bold">
                      Orden aleatorio activo
                    </span>
                  )}
                </div>

                {studyMode === "focus" && filteredVerbs.length > 0 && (
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-extrabold text-[#0F2547] dark:text-white">
                      Tarjeta {focusIndex + 1} de {filteredVerbs.length} ({progressPercentage}%)
                    </span>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* ====================================================================
              ÁREA PRINCIPAL DE ESTUDIO (MODO GRID O MODO FOCUS)
             ==================================================================== */}
          <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 flex-grow flex flex-col">
            {filteredVerbs.length === 0 ? (
              /* Estado vacío cuando un filtro o búsqueda no tiene coincidencias */
              <div className="my-auto bg-white dark:bg-[#112445] rounded-3xl border border-slate-200/90 dark:border-slate-700/80 p-8 sm:p-12 text-center max-w-lg mx-auto an-card-shadow">
                <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-[#0B1830] text-[#0F2547] dark:text-sky-300 flex items-center justify-center mx-auto mb-4 font-black text-xl">
                  ?
                </div>
                <h2 className="text-lg sm:text-xl font-extrabold text-[#0F2547] dark:text-white">
                  No hay verbos que coincidan con tu filtro actual
                </h2>
                <p className="mt-2 text-sm text-slate-500 dark:text-slate-300">
                  {onlyDifficult && difficultUids.size === 0
                    ? "Todavía no has marcado ningún verbo con la estrella de 'Difíciles'. Pulsa el icono de estrella en cualquier tarjeta para añadirlo a tu repaso."
                    : "Prueba a cambiar el texto de búsqueda, seleccionar 'Todos' los bloques o desactivar el filtro de difíciles."}
                </p>
                <div className="mt-5 flex flex-wrap items-center justify-center gap-2.5">
                  {searchQuery && (
                    <button
                      type="button"
                      onClick={() => setSearchQuery("")}
                      className="px-4 py-2 rounded-xl bg-[#0055A5] text-white text-xs font-extrabold"
                    >
                      Limpiar búsqueda
                    </button>
                  )}
                  {onlyDifficult && (
                    <button
                      type="button"
                      onClick={() => setOnlyDifficult(false)}
                      className="px-4 py-2 rounded-xl bg-[#F08519] text-white text-xs font-extrabold"
                    >
                      Ver todos los verbos
                    </button>
                  )}
                  {selectedBlock !== "all" && (
                    <button
                      type="button"
                      onClick={() => setSelectedBlock("all")}
                      className="px-4 py-2 rounded-xl bg-[#0F2547] dark:bg-sky-600 text-white text-xs font-extrabold"
                    >
                      Mostrar los 5 bloques
                    </button>
                  )}
                </div>
              </div>
            ) : studyMode === "grid" ? (
              /* ================================================================
                 VISTA 1: MODO GRID (Cuadrícula responsive)
                 ================================================================ */
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5 items-start">
                {filteredVerbs.map(verb => (
                  <VerbFlashcard
                    key={verb.uid}
                    verb={verb}
                    isDifficult={difficultUids.has(verb.uid)}
                    onToggleDifficult={handleToggleDifficult}
                    onSpeakAll={handleSpeakAllForms}
                    onSpeakSingle={handleSpeakSingleForm}
                    isFocusMode={false}
                  />
                ))}
              </div>
            ) : (
              /* ================================================================
                 VISTA 2: MODO FOCUS (Tarjeta individual ampliada y controles)
                 ================================================================ */
              <div className="my-auto py-2 flex flex-col items-center justify-center w-full max-w-2xl mx-auto space-y-5">
                
                {/* Barra de progreso de navegación de la lista activa */}
                <div className="w-full space-y-1.5">
                  <div className="flex items-center justify-between text-xs font-extrabold">
                    <span className="text-slate-500 dark:text-slate-300 uppercase tracking-wider">
                      Posición en lista actual
                    </span>
                    <span className="text-[#0F2547] dark:text-white font-mono text-sm">
                      {focusIndex + 1} / {filteredVerbs.length}
                    </span>
                  </div>
                  <div className="w-full h-2.5 bg-slate-200/80 dark:bg-[#152C52] rounded-full overflow-hidden">
                    <div
                      className="h-full bg-gradient-to-r from-[#0055A5] to-[#28A86B] transition-all duration-300 rounded-full"
                      style={{ width: `${progressPercentage}%` }}
                    ></div>
                  </div>
                </div>

                {/* Tarjeta Individual Focus */}
                {currentFocusVerb && (
                  <VerbFlashcard
                    key={currentFocusVerb.uid}
                    verb={currentFocusVerb}
                    isDifficult={difficultUids.has(currentFocusVerb.uid)}
                    onToggleDifficult={handleToggleDifficult}
                    onSpeakAll={handleSpeakAllForms}
                    onSpeakSingle={handleSpeakSingleForm}
                    isFocusMode={true}
                    externalFlipTrigger={keyboardFlipCount}
                  />
                )}

                {/* Controles táctiles grandes para Anterior / Audio / Difícil / Siguiente */}
                <div className="w-full max-w-lg grid grid-cols-4 gap-2.5 sm:gap-3 pt-1">
                  <button
                    type="button"
                    onClick={handlePrevFocus}
                    className="col-span-1 py-3.5 px-3 rounded-2xl bg-white dark:bg-[#112445] hover:bg-slate-50 dark:hover:bg-[#162E57] text-[#0F2547] dark:text-white border border-slate-200/90 dark:border-slate-700 font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1 an-card-shadow active:scale-95 transition"
                    aria-label="Verbo anterior"
                  >
                    <ChevronLeftIcon className="w-5 h-5" />
                    <span className="hidden sm:inline">Anterior</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => currentFocusVerb && handleSpeakAllForms(currentFocusVerb)}
                    className="col-span-1 py-3.5 px-3 rounded-2xl bg-[#0055A5]/10 dark:bg-[#0055A5]/30 hover:bg-[#0055A5] dark:hover:bg-[#0055A5] text-[#0055A5] dark:text-sky-200 hover:text-white border border-[#0055A5]/25 dark:border-sky-400/30 font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 active:scale-95 transition"
                    aria-label="Escuchar las 3 formas"
                  >
                    <SpeakerIcon className="w-5 h-5" />
                    <span>Audio</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => currentFocusVerb && handleToggleDifficult(currentFocusVerb.uid)}
                    className={`col-span-1 py-3.5 px-3 rounded-2xl border font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1.5 active:scale-95 transition ${
                      currentFocusVerb && difficultUids.has(currentFocusVerb.uid)
                        ? "bg-[#F08519] border-[#F08519] text-white"
                        : "bg-white dark:bg-[#112445] border-slate-200/90 dark:border-slate-700 text-[#0F2547] dark:text-white hover:bg-amber-50/60 dark:hover:bg-[#162E57]"
                    }`}
                    aria-label="Marcar o desmarcar como difícil"
                  >
                    <StarIcon
                      className="w-5 h-5"
                      filled={Boolean(currentFocusVerb && difficultUids.has(currentFocusVerb.uid))}
                    />
                    <span>Difícil</span>
                  </button>

                  <button
                    type="button"
                    onClick={handleNextFocus}
                    className="col-span-1 py-3.5 px-3 rounded-2xl bg-[#0055A5] hover:bg-[#0F2547] dark:hover:bg-sky-500 text-white font-extrabold text-xs sm:text-sm flex items-center justify-center gap-1 shadow-md shadow-[#0055A5]/25 active:scale-95 transition"
                    aria-label="Siguiente verbo"
                  >
                    <span className="hidden sm:inline">Siguiente</span>
                    <ChevronRightIcon className="w-5 h-5" />
                  </button>
                </div>

                {/* Ayuda de atajos de teclado en ordenadores */}
                <div className="hidden md:flex items-center justify-center gap-6 text-[11px] font-bold text-slate-400 dark:text-slate-400 pt-1">
                  <span className="flex items-center gap-1.5">
                    <kbd className="px-2 py-0.5 bg-white dark:bg-[#112445] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 dark:text-slate-300 shadow-sm">←</kbd>
                    <span>Anterior</span>
                  </span>
                  <span className="flex items-center gap-1.5">
                    <kbd className="px-2 py-0.5 bg-white dark:bg-[#112445] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 dark:text-slate-300 shadow-sm">Espacio</kbd>
                    <span>Girar tarjeta</span>
                  </span>
                  <span className="flex items-center gap-1.5">
                    <kbd className="px-2 py-0.5 bg-white dark:bg-[#112445] border border-slate-200 dark:border-slate-700 rounded-md text-slate-600 dark:text-slate-300 shadow-sm">→</kbd>
                    <span>Siguiente</span>
                  </span>
                </div>
              </div>
            )}
          </main>

          {/* ====================================================================
              PIE DE PÁGINA CORPORATIVO (AULA NEXT ESO)
             ==================================================================== */}
          <footer className="mt-10 bg-white dark:bg-[#0E1E3B] border-t border-slate-200/80 dark:border-slate-800 py-6 px-4 sm:px-6 lg:px-8 transition-colors duration-200">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-semibold text-slate-500 dark:text-slate-400">
              <div className="flex items-center gap-3">
                <span className="font-extrabold text-[#0F2547] dark:text-white">{BRAND_CONFIG.name}</span>
                <span>·</span>
                <span>105 VERBOS · LISTA OFICIAL DE INGLÉS (1.º ESO)</span>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-4">
                <a
                  href={BRAND_CONFIG.phoneHref}
                  className="hover:text-[#0055A5] dark:hover:text-sky-300 transition flex items-center gap-1"
                >
                  <span>📞</span>
                  <span>{BRAND_CONFIG.phone}</span>
                </a>
                <a
                  href={BRAND_CONFIG.emailHref}
                  className="hover:text-[#0055A5] dark:hover:text-sky-300 transition flex items-center gap-1"
                >
                  <span>✉️</span>
                  <span>{BRAND_CONFIG.email}</span>
                </a>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
